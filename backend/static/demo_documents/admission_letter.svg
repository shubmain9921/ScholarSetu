  <text x="60" y="270" class="field" font-size="16">Rahul Kumar</text>
  <text x="60" y="295" class="body">Subject: Registration for Ph.D. Degree in Department of Tribal Studies & Ethnobotany</text>

  <text x="60" y="360" class="body">Dear Candidate,</text>
  <text x="60" y="400" class="body">You are hereby informed that you have been admitted as a full-time, regular</text>
  <text x="60" y="435" class="body">research scholar in this University under the guidance of <tspan class="field">Dr. P. K. Nayak</tspan>.</text>

