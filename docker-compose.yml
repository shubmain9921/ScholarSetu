version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarsetu_postgres
    restart: always
    environment:
      POSTGRES_USER: scholarsetu
      POSTGRES_PASSWORD: scholarsetu_pw
      POSTGRES_DB: scholarsetu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarsetu -d scholarsetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholarsetu_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: scholarsetu_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarsetu_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://scholarsetu:scholarsetu_pw@postgres:5432/scholarsetu_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scholarsetu_worker
    restart: always
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgresql://scholarsetu:scholarsetu_pw@postgres:5432/scholarsetu_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scholarsetu_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
